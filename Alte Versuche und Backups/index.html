<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Visualisierungs-Browser</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .browser-container { display: flex; gap: 20px; }
        .filter-sidebar { width: 300px; padding: 15px; border-right: 1px solid #ccc; }
        .visualization-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .vis-item { border: 1px solid #ddd; padding: 10px; border-radius: 5px; cursor: pointer; transition: transform 0.2s; }
        .vis-item:hover { transform: scale(1.02); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .vis-item img { width: 100%; height: auto; display: block; margin-bottom: 10px; border-radius: 3px; }
        .vis-item h4 { margin: 0 0 5px 0; font-size: 1.1em; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 900px; border-radius: 8px; }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: #000; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🔍 Visualisierungs-Browser</h1>

    <div class="browser-container">
        
        <div class="filter-sidebar">
            <h3>Filter</h3>
            
            <label for="quelleFilter">Quelle:</label>
            <select id="quelleFilter" onchange="filterVisualizations()"></select>

            <br><br>

            <label for="artFilter">Art der Visualisierung:</label>
            <select id="artFilter" onchange="filterVisualizations()"></select>

            <br><br>
            
            <label for="unsicherheitFilter">Typ der Unsicherheit:</label>
            <select id="unsicherheitFilter" onchange="filterVisualizations()"></select>

            <br><br>
            
            <button onclick="resetFilters()">Filter zurücksetzen</button>
        </div>

        <div class="visualization-grid" id="visualizationGrid">
            <h2>Lade Daten...</h2>
        </div>

    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <p><strong>Quelle:</strong> <span id="modalQuelle"></span></p>
            <p><strong>Datum:</strong> <span id="modalDatum"></span></p>
            <p><strong>Beschreibung:</strong> <span id="modalBeschreibung"></span></p>
            <p><strong>Art der Visualisierung:</strong> <span id="modalArt"></span></p>
            <p><strong>Visualisierung der Unsicherheit:</strong> <span id="modalUnsicherheit"></span></p>
            <p><strong>Typ der Unsicherheit:</strong> <span id="modalTypUnsicherheit"></span></p>
            <p><a id="modalLink" href="#" target="_blank">Zum Original-Artikel</a></p>
            <div style="text-align: center; margin-top: 20px;"><img id="modalImage" src="" alt="Visualisierung im Detail" style="max-width: 80%; height: auto;"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="csv.js"></script> </body>
</html>
