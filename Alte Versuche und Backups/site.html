<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Uncertainty Visualizations — Explorer</title>
  <meta name="description" content="Sammlung journalistischer Unsicherheits-Visualisierungen – Explorer, Use Cases, Detailseiten. Prototyp basierend auf Possin & Kinkeldey." />
  <style>
    /* --- Globale Variablen --- */
    :root{
      --bg:#0f172a;
      --card-bg:#1e293b;
      --text:#f8fafc;
      --muted:#94a3b8;
      --accent:#22c55e;
      --accent-soft: rgba(34, 197, 94, 0.2);
      --radius:8px;
      --maxw:1200px;
      --gap:18px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* --- Basis-Styling --- */
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #334155;background:var(--bg);position:sticky;top:0;z-index:10;}
    .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.4em;}
    .logo .mark{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900;}
    main{max-width:var(--maxw);margin:30px auto;padding:0 var(--gap);}

    /* --- Steuerelemente (Suchleiste & Filter) --- */
    .controls{display:flex;gap:15px;margin-bottom:25px;flex-wrap:wrap;align-items:center;}
    .controls input[type="search"],.controls select{
      padding:10px 15px;border:1px solid #475569;border-radius:var(--radius);
      background-color:var(--card-bg);color:var(--text);font-size:16px;
      min-width:200px;outline:none;transition:border-color 0.2s;
    }
    .controls select{min-width:180px;appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'%3e%3cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z' clip-rule='evenodd' /%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 10px center;background-size:16px;}
    .controls input[type="search"]:focus,.controls select:focus{border-color:var(--accent);}
    .controls label{font-weight:600;color:var(--muted);white-space:nowrap;margin-left:5px;}

    /* --- Galerie (Grid-Ansicht) --- */
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap);}
    .card{
      background-color:var(--card-bg);border-radius:var(--radius);overflow:hidden;
      cursor:pointer;transition:transform 0.2s, box-shadow 0.2s;
      display:flex;flex-direction:column;min-height:320px;
    }
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(0,0,0,0.5);}
    .thumb{width:100%;height:180px;background-color:#0f172a;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .thumb img{width:100%;height:100%;object-fit:cover;}
    .meta{padding:15px;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between;}
    .title{font-size:1.1em;font-weight:600;margin-bottom:5px;line-height:1.3;}
    .sub{font-size:0.85em;color:var(--muted);}
    .empty-state{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--muted);font-size:1.2em;}

    /* --- Modal (Detailansicht) --- */
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:1000;padding:var(--gap);}
    .modal-content{
      background-color:var(--card-bg);padding:30px;border-radius:var(--radius);
      max-width:900px;max-height:95vh;overflow-y:auto;position:relative;
      box-shadow:0 0 30px rgba(0,0,0,0.7);
      width:100%;
    }
    .close-btn{position:absolute;top:15px;right:25px;font-size:2.5em;font-weight:200;color:var(--muted);cursor:pointer;transition:color 0.2s;}
    .close-btn:hover{color:var(--accent);}
    .modal-header{margin-bottom:20px;}
    #modal-title{font-size:2em;font-weight:700;margin-bottom:5px;color:var(--accent);}
    #modal-meta{font-size:1em;color:var(--muted);margin-bottom:10px;}
    .modal-thumb{width:100%;height:300px;background-color:#0f172a;margin-bottom:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:var(--radius);}
    .modal-thumb img{max-width:100%;max-height:100%;object-fit:contain;}

    /* --- Strukturierte Metadaten im Modal --- */
    .metadata-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px;margin-bottom:20px;}
    .metadata-card{background-color:var(--bg);padding:15px;border-radius:var(--radius);border-left:4px solid var(--accent);}
    .metadata-card h4{font-size:0.9em;color:var(--accent);margin:0 0 5px 0;text-transform:uppercase;letter-spacing:0.05em;}
    .metadata-card p{margin:0;font-size:1em;font-weight:500;}

    /* --- Tags-Styling --- */
    .tag-container{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
    .tag{
      display:inline-block;padding:4px 10px;background-color:#374151;color:#f8fafc;
      border-radius:4px;font-size:0.8em;font-weight:500;
    }
    .link-area{margin-top:20px;padding-top:20px;border-top:1px solid #334155;}
    #modal-link{
      display:inline-block;color:var(--accent);text-decoration:none;font-weight:600;
      padding:10px 20px;border:1px solid var(--accent);border-radius:5px;
      transition:background-color 0.2s;
    }
    #modal-link:hover{background-color:var(--accent-soft);}
  </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="mark">?</div>
        Uncertainty Explorer
    </div>
</header>

<main>
    <h1>Visualisierungen der Unsicherheit im Journalismus</h1>

    <div class="controls">
      <label for="search">Suchen:</label>
      <input type="search" id="search" placeholder="Titel, Quelle, Tags..." onkeyup="filterGallery()">

      <label for="filter-cluster">Szenario (Cluster):</label>
      <select id="filter-cluster" onchange="filterGallery()">
        <option value="">Alle Szenarien</option>
      </select>
      
      <label for="filter-type">Unsicherheits-Typ:</label>
      <select id="filter-type" onchange="filterGallery()">
        <option value="">Alle Typen</option>
      </select>
    </div>

    <div class="gallery" id="gallery">
        </div>
</main>

<div class="modal" id="modal" onclick="if(event.target.id === 'modal' || event.target.id === 'close-btn') closeModal()">
    <div class="modal-content">
        <span class="close-btn" id="close-btn">&times;</span>
        
        <div class="modal-header">
            <div id="modal-title"></div>
            <div id="modal-meta"></div>
        </div>

        <div class="modal-thumb" id="modal-thumb">
            </div>
        
        <h3>Beschreibung & Kontext</h3>
        <p id="modal-desc"></p>
        
        <h3>Unsicherheitsanalyse</h3>
        <p id="modal-unc"></p>
        
        <div class="metadata-grid">
            <div class="metadata-card">
                <h4>Cluster / Szenario</h4>
                <p id="metadata-cluster"></p>
            </div>
            <div class="metadata-card">
                <h4>Unsicherheits-Typ</h4>
                <p id="metadata-type"></p>
            </div>
            <div class="metadata-card">
                <h4>Visuelle Dimensionen</h4>
                <p id="metadata-dimensions"></p>
            </div>
        </div>
        
        <div id="modal-tags-container" class="tag-container">
            </div>

        <div class="link-area">
            <a id="modal-link" href="#" target="_blank">Zum Originalartikel / Quelle</a>
        </div>
    </div>
</div>

let DATA = [];
let FILTERED_DATA = [];

/* ---------------------------------------------------------
   I. Daten vorbereiten (Die alte loadCSV() Funktion)
   --------------------------------------------------------- */
function prepareData() {
    // Führt die Bereinigung und Indexierung durch, die vorher PapaParse gemacht hat
    DATA = RAW_DATA.map((d, i) => {
        // Bereinigt den Cluster-Wert (z.B. "1: Forecast" wird zu "Forecast")
        const clusterValue = (d["Cluster"] || "").split(":").length > 1 ? (d["Cluster"] || "").split(":")[1].trim() : (d["Cluster"] || "").trim();
        
        // Bereinigt die Dimensionswerte (z.B. entfernt Whitespace)
        const cleanDim = (key) => (d[key] || "").trim();

        return {
            ...d,
            index: i,
            titel: cleanDim("Titel ") || cleanDim("Visualisierungstitel (falls nicht identisch)") || "Untitled",
            quelle: cleanDim("Quelle - Tags") || "",
            datum: cleanDim("Datum") || "",
            cluster: clusterValue,
            unsicherheits_typ: cleanDim("type of uncertainty") || "",
            beschreibung: cleanDim("Beschreibung") || "Keine Beschreibung vorhanden.",
            unsicherheits_analyse: cleanDim("Visualisierung der Unsicherheit") || cleanDim("Art der Visualisierung - Tags") || "Keine spezifische Unsicherheitsbeschreibung.",
            link: cleanDim("Link") || "",
            bild: cleanDim("Bild") || "",
            dimension_coincident: cleanDim("coincident / adjacent"),
            dimension_explicit: cleanDim("implicit / explicit"),
            dimension_extrinsic: cleanDim("intrinsic / extrinsic "), // Wichtig: Leerzeichen beibehalten, falls es im Rohdaten-Key so war
            dimension_static: cleanDim("static / dynamic"),
            vis_tags: cleanDim("Art der Visualisierung - Tags") // Für einfaches Parsen im Modal
        };
    });
    return DATA;
}


/* ---------------------------------------------------------
   II. Explorer Rendering und Logik (Unverändert)
   --------------------------------------------------------- */

/**
 * Erzeugt die Gallery-Karten.
 */
function renderGallery(data) {
    const gal = document.getElementById("gallery");
    gal.innerHTML = "";

    if (data.length === 0) {
        gal.innerHTML = `<div class="empty-state">Keine Ergebnisse gefunden, die Ihren Such- und Filterkriterien entsprechen.</div>`;
        return;
    }

    data.forEach(d => {
        const card = document.createElement("div");
        card.className = "card";
        // Öffne die Detailansicht basierend auf dem Original-Index
        card.setAttribute("onclick", `openDetail(${d.index})`);

        card.innerHTML = `
          <div class="thumb">
              <img src="${d.bild}" alt="Vorschaubild für ${d.titel}" onerror="this.onerror=null;this.src='https://via.placeholder.com/280x180/1e293b/94a3b8?text=NO+IMAGE';">
          </div>
          <div class="meta">
              <div>
                  <div class="title">${d.titel}</div>
                  <div class="sub">${d.quelle || "Unbekannte Quelle"} • ${d.datum || "Datum Unbekannt"}</div>
              </div>
              <div class="tag-container">
                  <div class="tag" style="background-color: #f97316;">Szenario: ${d.cluster.split(',')[0] || 'N/A'}</div>
                  <div class="tag" style="background-color: #6366f1;">Typ: ${d.unsicherheits_typ.split(',')[0] || 'N/A'}</div>
              </div>
          </div>
        `;

        gal.appendChild(card);
    });
}

/**
 * Filtert und durchsucht die DATA basierend auf den Steuerelementen.
 */
function filterGallery() {
    const searchTerm = document.getElementById("search").value.toLowerCase();
    const clusterFilter = document.getElementById("filter-cluster").value;
    const typeFilter = document.getElementById("filter-type").value;

    FILTERED_DATA = DATA.filter(d => {
        // 1. Suche
        const searchFields = [
            d.titel, d.beschreibung, d.quelle, d.unsicherheits_typ, d.cluster, d.vis_tags, d.unsicherheits_analyse
        ].map(s => s ? s.toLowerCase() : "");

        const matchesSearch = searchTerm === "" || searchFields.some(field => field.includes(searchTerm));

        // 2. Cluster/Szenario Filter: Muss den Cluster-Wert enthalten (da es mehrere geben kann, z.B. "1: Forecast, 3: Spatial")
        const matchesCluster = clusterFilter === "" || d.cluster.includes(clusterFilter);

        // 3. Type of Uncertainty Filter: Muss den Typ-Wert enthalten
        const matchesType = typeFilter === "" || d.unsicherheits_typ.includes(typeFilter);
        
        return matchesSearch && matchesCluster && matchesType;
    });

    renderGallery(FILTERED_DATA);
}

/**
 * Befüllt die Filter-Dropdowns dynamisch mit den "Cluster" (Szenarien)
 * und "type of uncertainty" (Unsicherheits-Typen).
 */
function populateFilters(data) {
    const clusterSelect = document.getElementById("filter-cluster");
    const typeSelect = document.getElementById("filter-type");

    const extractAndPopulate = (key, selectElement) => {
        // Sammle alle eindeutigen Werte (auch wenn sie durch Komma getrennt sind)
        let allValues = [];
        data.forEach(d => {
            if (d[key]) {
                d[key].split(',').map(v => v.trim()).filter(v => v !== "" && !v.includes("unclear")).forEach(v => allValues.push(v));
            }
        });
        
        const uniqueValues = [...new Set(allValues)].sort();
        
        uniqueValues.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            selectElement.appendChild(option);
        });
    };

    extractAndPopulate("cluster", clusterSelect);
    extractAndPopulate("unsicherheits_typ", typeSelect);
}


/* ---------------------------------------------------------
   III. Modal (Detailansicht) (Unverändert)
   --------------------------------------------------------- */

function openDetail(originalIndex) {
    const d = DATA.find(item => item.index === originalIndex); // Suche das Original-Objekt

    if (!d) return;

    // Hauptinhalte
    document.getElementById("modal-title").textContent = d.titel;
    document.getElementById("modal-meta").textContent = `${d.quelle || 'N/A'} • ${d.datum || 'N/A'}`;
    // Ersetze Zeilenumbrüche für die Anzeige
    document.getElementById("modal-desc").innerHTML = (d.beschreibung || "Keine Beschreibung vorhanden.").replace(/\r\n|\n|\r/g, '<br/>');
    document.getElementById("modal-unc").innerHTML = (d.unsicherheits_analyse || "Keine spezifische Unsicherheitsbeschreibung.").replace(/\r\n|\n|\r/g, '<br/>');

    // Metadaten-Grid (Possin/Kinkeldey Dimensionen)
    document.getElementById("metadata-cluster").textContent = d.cluster || 'Nicht angegeben';
    document.getElementById("metadata-type").textContent = d.unsicherheits_typ || 'Nicht angegeben';

    document.getElementById("metadata-dimensions").innerHTML = `
        <strong>Koinzident/Adjacent:</strong> ${d.dimension_coincident || 'N/A'}<br/>
        <strong>Explizit/Implizit:</strong> ${d.dimension_explicit || 'N/A'}<br/>
        <strong>Extrinsisch/Intrinsisch:</strong> ${d.dimension_extrinsic || 'N/A'}<br/>
        <strong>Statisch/Dynamisch:</strong> ${d.dimension_static || 'N/A'}
    `;

    // Tags
    const tagsContainer = document.getElementById("modal-tags-container");
    tagsContainer.innerHTML = '';
    
    // Füge die Tags aus Art der Visualisierung hinzu (falls vorhanden)
    const visTags = d.vis_tags ? d.vis_tags.split(',').map(t => t.trim()).filter(t => t !== "") : [];
    visTags.forEach(tagText => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = tagText;
        tagsContainer.appendChild(tag);
    });

    // Bild im Modal
    document.getElementById("modal-thumb").innerHTML =
        `<img src="${d.bild}" alt="Vorschaubild für ${d.titel}" onerror="this.onerror=null;this.src='https://via.placeholder.com/900x300/1e293b/94a3b8?text=NO+IMAGE';">`;
    
    // Link
    const linkElement = document.getElementById("modal-link");
    if (d.link) {
        linkElement.href = d.link;
        linkElement.style.display = "inline-block";
    } else {
        linkElement.href = "#";
        linkElement.style.display = "none";
    }

    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}


/* ---------------------------------------------------------
   IV. Initialisierung
   --------------------------------------------------------- */
(function initializeExplorer() {
    try {
        const preparedData = prepareData();
        DATA = preparedData;
        FILTERED_DATA = preparedData;
        
        populateFilters(DATA);
        renderGallery(DATA);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById("modal").style.display === 'flex') {
                closeModal();
            }
        });

        console.log(`Daten erfolgreich integriert und Explorer initialisiert. ${DATA.length} Einträge gefunden.`);
    } catch (error) {
        console.error("Fehler bei der Initialisierung des Explorers:", error);
        document.getElementById("gallery").innerHTML = `<div class="empty-state" style="color:#f87171; background-color:#450a0a; border: 1px solid #7f1d1d; padding: 20px; border-radius: 8px;">
            <h2>🚨 Schwerwiegender Fehler!</h2>
            <p>Fehler bei der Verarbeitung der eingebetteten Daten. Bitte überprüfen Sie die Konsolenmeldung.</p>
        </div>`;
    }
})();
</script>
