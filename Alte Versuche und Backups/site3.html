/* ---------------------------------------------------------
   CSV → JavaScript Objekt Parser
   --------------------------------------------------------- */
function parseCSV(text) {
    // Entfernt führende/nachfolgende Leerzeichen und filtert leere Zeilen.
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim() !== ""); 
    const header = lines[0].split(",").map(h => h.replace(/^"|"$/g, "").trim());

    return lines.slice(1).map(line => {
        // Regulärer Ausdruck, um Werte in doppelten Anführungszeichen korrekt zu parsen
        const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
        const entry = {};
        
        header.forEach((h, i) => {
            // Entfernt umgebende doppelte Anführungszeichen
            entry[h] = values[i] ? values[i].replace(/^"|"$/g, "") : "";
        });
        return entry;
    });
}

/* ---------------------------------------------------------
   Page Rendering
   --------------------------------------------------------- */
let DATA = [];

function renderGallery() {
    const gal = document.getElementById("gallery");
    gal.innerHTML = "";

    DATA.forEach((d, idx) => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openDetail(idx);

        // Sucht zuerst im Feld "Bild", ansonsten im Feld "Visualisierungstitel" oder "Titel "
        const imageName = d["Bild"] || d["Visualisierungstitel (falls nicht identisch)"] || d["Titel "] || "(kein Dateiname)"; 

        card.innerHTML = `
          <div class="thumb-placeholder">
              <div class="thumb-label">${imageName.split('.')[0]}</div>
          </div>
          <div class="meta">
              <div class="title">${d["Titel "] || d["Visualisierungstitel (falls nicht identisch)"] || "Untitled"}</div>
              <div class="sub">${d["Quelle - Tags"] || ""} • ${d["Datum"] || ""}</div>
          </div>
        `;

        gal.appendChild(card);
    });
}

/* ---------------------------------------------------------
   Modal
   --------------------------------------------------------- */

function openDetail(i) {
    const d = DATA[i];
    document.getElementById("modal-title").textContent = d["Titel "] || d["Visualisierungstitel (falls nicht identisch)"] || "";
    document.getElementById("modal-meta").textContent = `${d["Quelle - Tags"] || ""} • ${d["Datum"] || ""}`;
    document.getElementById("modal-desc").textContent = d["Beschreibung"] || "";
    // Verwendet "Visualisierung der Unsicherheit" als primäre Beschreibung
    document.getElementById("modal-unc").textContent = d["Visualisierung der Unsicherheit"] || d["Art der Visualisierung - Tags"] || "";
    document.getElementById("modal-link").href = d["Link"] || "#";

    // Setzt den Text im Thumbnail des Modals
    const modalThumb = document.getElementById("modal-thumb");
    modalThumb.innerHTML = ``;
    modalThumb.textContent = d["Bild"] ? d["Bild"].split('.')[0] : 'Kein Bildname';


    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

/* ---------------------------------------------------------
   INIT
   --------------------------------------------------------- */
loadCSV().then(data => {
    DATA = data;
    renderGallery();
}).catch(error => {
    console.error("Fehler beim Laden oder Parsen der Daten:", error);
    document.getElementById("gallery").innerHTML = "Fehler beim Laden der Daten.";
});
</script>
